name: Renotag, Inc.
description: Renotag, Inc. is a Calgary, Canada based construction-technology startup (founded 2020,
  backed by 500 Global) that builds home-renovation and construction cost-estimation software. Its
  product produces localized renovation estimates and material takeoffs in minutes by combining user
  inputs with regional labor and material pricing data, helping contractors quote and close more
  business. As of this enrichment pass Renotag publishes no public developer program, API, OpenAPI
  specification, SDK, or documentation surface; the primary web properties (renotag.com and
  api.renotag.com) currently return HTTP 301 redirect loops, and the app is a private login at
  app.renotag.com. This profile is retained as a portfolio lead surfaced from the 500 Global portfolio.
